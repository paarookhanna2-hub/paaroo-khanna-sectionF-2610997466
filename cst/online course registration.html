<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>

<body>

    <h1 align="center">Online Course Registration</h1>

    <form action="submit.html" target="_blank" method="post">

        <!-- Hidden Input -->
        <input type="hidden" name="formType"
               value="Online Course Registration">

        <fieldset>
            <legend><b>Student Personal Information</b></legend>

            <!-- Student Name -->
            <label for="studentName">Student Name:</label>
            <input type="text"
                   id="studentName"
                   name="studentName"
                   placeholder="Enter your full name"
                   required>
            <br><br>

            <!-- Email -->
            <label for="email">Email Address:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email address"
                   required>
            <br><br>

            <!-- Mobile -->
            <label for="mobile">Mobile Number:</label>
            <input type="tel"
                   id="mobile"
                   name="mobile"
                   placeholder="Enter your mobile number"
                   required>
            <br><br>

            <!-- Age -->
            <label for="age">Age:</label>
            <input type="number"
                   id="age"
                   name="age"
                   placeholder="Enter your age"
                   min="13"
                   max="100">
            <br><br>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>
            <br><br>

            <!-- Date of Birth -->
            <label for="dob">Date of Birth:</label>
            <input type="date"
                   id="dob"
                   name="dob">
            <br><br>

        </fieldset>

        <br>

        <!-- Gender -->
        <fieldset>
            <legend><b>Gender</b></legend>

            <input type="radio"
                   id="male"
                   name="gender"
                   value="Male"
                   required>
            <label for="male">Male</label>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="Female">
            <label for="female">Female</label>

            <input type="radio"
                   id="other"
                   name="gender"
                   value="Other">
            <label for="other">Other</label>

        </fieldset>

        <br>

        <!-- Skills -->
        <fieldset>
            <legend><b>Skills</b></legend>

            <input type="checkbox"
                   id="html"
                   name="skills"
                   value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox"
                   id="css"
                   name="skills"
                   value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox"
                   id="javascript"
                   name="skills"
                   value="JavaScript">
            <label for="javascript">JavaScript</label>

            <input type="checkbox"
                   id="python"
                   name="skills"
                   value="Python">
            <label for="python">Python</label>

        </fieldset>

        <br>

        <!-- Course Selection -->
        <fieldset>
            <legend><b>Course Preferences</b></legend>

            <label for="course">Select Course:</label>

            <select id="course"
                    name="course"
                    required>

                <option value="">-- Select a Course --</option>
                <option value="web-development">
                    Web Development
                </option>
                <option value="python-programming">
                    Python Programming
                </option>
                <option value="data-analytics">
                    Data Analytics
                </option>
                <option value="digital-marketing">
                    Digital Marketing
                </option>

            </select>

            <br><br>

            <!-- Preferred Class Time -->
            <label for="classTime">Preferred Class Time:</label>
            <input type="time"
                   id="classTime"
                   name="classTime">

        </fieldset>

        <br>

        <!-- Address / Additional Information -->
        <fieldset>
            <legend><b>Address / Additional Information</b></legend>

            <label for="address">
                Address / Additional Information:
            </label>
            <br>

            <textarea id="address"
                      name="address"
                      rows="5"
                      cols="50"
                      placeholder="Enter your address or additional information">
            </textarea>

        </fieldset>

        <br>

        <!-- File Upload -->
        <fieldset>
            <legend><b>Supporting Document</b></legend>

            <label for="document">
                Upload Document or Photograph:
            </label>

            <input type="file"
                   id="document"
                   name="document"
                   accept=".pdf,.jpg,.jpeg,.png">

        </fieldset>

        <br>

        <!-- Submit and Reset -->
        <div align="center">

            <input type="submit"
                   value="Submit Registration">

            <input type="reset"
                   value="Reset Form">

        </div>

    </form>

</body>
</html>
</body>
</html>
