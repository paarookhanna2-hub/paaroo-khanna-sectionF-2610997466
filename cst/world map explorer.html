    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World Map Explorer</title>
</head>
<body>
  <h1>World Map Explorer</h1>
  <p>Click on the countries to explore!</p>

  <!-- Visible World Map -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg" 
       alt="World Map" usemap="#worldmap" width="800">

  <!-- Image Map -->
  <map name="worldmap">
    <!-- USA (circle region) -->
    <area shape="circle" coords="220,150,30" href="https://en.wikipedia.org/wiki/United_States" alt="USA" target="_blank">

    <!-- Australia (rectangle region) -->
    <area shape="rect" coords="650,350,750,450" href="https://en.wikipedia.org/wiki/Australia" alt="Australia" target="_blank">

    <!-- India (polygon region) -->
    <area shape="poly" coords="500,220,520,230,540,240,530,260,510,250" href="https://en.wikipedia.org/wiki/India" alt="India" target="_blank">

    <!-- Default (anywhere else) -->
    <area shape="default" href="https://en.wikipedia.org/wiki/World" alt="World" target="_blank">
  </map>
</body>
</html>
